# llguidance v1.9.1's parser/Cargo.toml with these removed (the Rust code is unchanged): [dev-dependencies], [[bench]],
# the optional dependencies jsonschema and lazy_static (feature jsonschema_validation), instant (feature wasm) and
# the build dependency cbindgen (feature generate-header; the checked-in llguidance.h is used as it is). [lints.rust]
# is added so that the code's cfg(feature = ...) of those three features does not warn.
[package]
name = "llguidance"
version = "1.9.1"
edition = "2021"
license = "MIT"
description = "Super-fast Structured Outputs"
repository = "https://github.com/guidance-ai/llguidance"
rust-version.workspace = true

[dependencies]
toktrie = { workspace = true }
derivre = { version = "=0.3.13", default-features = false, features = ["compress"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["preserve_order"] }
anyhow = "1.0.95"
regex-syntax = "0.8.5"
indexmap = "2.7.1"

referencing =  { version = "0.29.0", optional = true }

rayon = { version = "1.10.0", optional = true }

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[features]
default = ["lark", "rayon", "referencing", "ahash"]
logging = []                                                  # this is extensive debug logging
lark = []                                                     # ~115k (binary)
rayon = ["dep:rayon"]
referencing = ["dep:referencing"]
ahash = ["derivre/ahash"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("jsonschema_validation", "wasm", "generate-header"))'] }
